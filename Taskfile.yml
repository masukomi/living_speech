version: '3'

vars:
  # APP_NAME names the executable (and must match CFBundleExecutable in
  # build/darwin/Info.plist); APP_DISPLAY_NAME names the .app bundle and .dmg.
  APP_NAME: "livingspeech"
  APP_DISPLAY_NAME: "LivingSpeech"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # LivingSpeech is macOS-only (it uses macOS speech, login-item, and window
  # APIs), so every build targets darwin.
  MACOS_ONLY_MSG: "LivingSpeech only builds on macOS, for macOS."

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    preconditions: &macos_only
      - sh: '[ "{{OS}}" = darwin ] && [ "{{.GOOS | default "darwin"}}" = darwin ]'
        msg: "{{.MACOS_ONLY_MSG}}"
    cmds:
      - task: darwin:build

  package:
    summary: Packages a production build of the application
    preconditions: *macos_only
    cmds:
      - task: darwin:package

  run:
    summary: Runs the application
    preconditions: *macos_only
    cmds:
      - task: darwin:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
